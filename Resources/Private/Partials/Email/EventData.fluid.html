<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<h3><f:translate domain="md_eventmgt_frontend.messages" key="email.eventData.headline" /></h3>

<dl>
    <dt><f:translate domain="md_eventmgt_frontend.messages" key="email.eventData.user" /></dt>
    <dd>{feUser.name}</dd>

    <dt><f:translate domain="md_eventmgt_frontend.messages" key="email.eventData.uid" /></dt>
    <dd>{event.uid}</dd>

    <dt><f:translate domain="md_eventmgt_frontend.messages" key="email.eventData.date" /></dt>
    <dd>
        {event.startdate -> f:format.date(format:"d.m.Y")}
        <f:if condition="{event.enddate}">
            <f:translate domain="md_eventmgt_frontend.messages" key="email.eventData.until" /> {event.enddate -> f:format.date(format: '{settings.dateFormat.{settings.selectedDateFormat}.format}')}
        </f:if>
    </dd>

    <f:if condition="{event.title}">
        <dt><f:translate domain="md_eventmgt_frontend.messages" key="email.eventData.title" /></dt>
        <dd>{event.title}</dd>
    </f:if>

    <f:if condition="{event.teaser}">
        <dt><f:translate domain="md_eventmgt_frontend.messages" key="email.eventData.teaser" /></dt>
        <dd>{event.teaser}</dd>
    </f:if>

    <f:if condition="{event.description}">
        <dt><f:translate domain="md_eventmgt_frontend.messages" key="email.eventData.description" /></dt>
        <dd>{event.description -> f:format.html()}</dd>
    </f:if>
</dl>
</html>
